apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
spec:
  project: infra
  source:
    repoURL: git@github.com:lotechdevops/gitops-homelab.git
    targetRevision: main
    path: config/observability
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
